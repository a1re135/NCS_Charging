services:
  ncs:
    build: .
    restart: unless-stopped
    environment:
      PORT: "5000"
      NCS_TRUST_PROXY: "1"
      NCS_COOKIE_SECURE: "1"
      NCS_SECRET_KEY: "${NCS_SECRET_KEY:?set a random secret in .env}"
      NCS_CAPACITY_LEVEL: "L1"
    volumes:
      - ncs-data:/app/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      ncs:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ncs-data:
