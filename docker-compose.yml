services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ncs-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ncs_charging}
      MYSQL_USER: ${MYSQL_USER:-ncs_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  ncs:
    build: .
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    environment:
      PORT: "5000"

      NCS_TRUST_PROXY: "1"
      NCS_COOKIE_SECURE: "0"
      NCS_SECRET_KEY: ${NCS_SECRET_KEY:-local-development-secret}
      NCS_CAPACITY_LEVEL: "L1"

      NCS_LLM_ENABLED: ${NCS_LLM_ENABLED:-0}
      NCS_LLM_PROVIDER: ${NCS_LLM_PROVIDER:-bigmodel}

      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      BIGMODEL_BASE_URL: ${BIGMODEL_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      BIGMODEL_MODEL: ${BIGMODEL_MODEL:-glm-4-flashx-250414}

      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ncs_charging}
      MYSQL_USER: ${MYSQL_USER:-ncs_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}

      NCS_THREADS: ${NCS_THREADS:-48}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


volumes:
  mysql-data: