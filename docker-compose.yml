services:
  ncs:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NCS_TRUST_PROXY: "1"
      NCS_COOKIE_SECURE: "0"
      NCS_SECRET_KEY: "replace-with-a-long-random-secret"
      NCS_CAPACITY_LEVEL: "L1"
    volumes:
      - ncs-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ncs-data:
