name: NCS Charging CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py ncs/*.py performance_test.py prepare_l1_loadtest.py
      - run: python -m unittest discover -s tests -v
      - run: docker build -t ncs-charging-ci .
