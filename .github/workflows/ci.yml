name: NCS Charging CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ncs_charging_test
          MYSQL_USER: ncs_app
          MYSQL_PASSWORD: test-password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    env:
      NCS_SECRET_KEY: ci-test-secret

      NCS_LLM_ENABLED: "0"

      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"

      MYSQL_DATABASE: ncs_charging
      MYSQL_TEST_DATABASE: ncs_charging_test

      MYSQL_USER: ncs_app
      MYSQL_PASSWORD: test-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile app.py
          python -m py_compile ncs/*.py
          python -m py_compile performance_test.py
          python -m py_compile prepare_l1_loadtest.py
          python -m py_compile tests/*.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build Docker image
        run: |
          docker build -t ncs-charging-ci .